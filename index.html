<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生日照片星球</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-wrap" aria-label="生日照片星球">
        <canvas id="scene" width="1280" height="900"></canvas>
        <audio id="bgMusic" src="./bgm/HBD%20To%20You.Midnight%20Ver..-CSR%20.%EC%B2%AB%EC%82%AC%EB%9E%91.%232xpPov.mp3" loop preload="auto"></audio>
        <video id="camera" autoplay playsinline muted></video>
        <button id="startGiftBtn" class="start-gift" type="button">开启礼物</button>
        <button id="photoWallBtn" class="sphere-action cake-action" type="button">散开照片墙</button>
        <button id="cakeMergeBtn" class="sphere-action" type="button">聚合成蛋糕</button>
        <div class="hud" aria-hidden="true">
          <div class="status" id="status">点击开启照片星球</div>
        </div>
      </section>

      <aside class="panel" aria-hidden="true">
        <input id="photoInput" type="file" accept="image/*" />
        <input id="messageInput" value="生日快乐" maxlength="18" />
        <input id="nameInput" value="My Love" maxlength="16" />
        <textarea id="letterInput" maxlength="46">愿你永远被爱包围。</textarea>
        <input id="zoomRange" type="range" min="0.45" max="2.2" step="0.01" value="1" />
        <input id="sparkRange" type="range" min="0.5" max="2" step="0.05" value="1.15" />
        <button id="explodeBtn" type="button">爆照</button>
        <button id="cakeBtn" type="button">回到蛋糕</button>
        <button id="moodBtn" type="button">黑白电影</button>
        <button id="cameraBtn" type="button">开启摄像头</button>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
